name: validate

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The smoke-test TTS engine is built from source so CI can exercise the voice
      # pipeline without any model weights. Skipped loudly if the build environment
      # is unavailable — validation itself must not depend on it.
      - name: Bootstrap
        run: npm run bootstrap

      - name: Doctor (environment + egress report)
        run: npm run doctor

      - name: Unit tests
        run: npm test

      - name: Validate assets, voice registry and episode
        run: npm run validate

      # Voices are still unapproved in CI (no human approval yet), so the episode-level
      # voice gate is expected to block. Structure must still be valid — this asserts it.
      - name: Episode structure (strict structure, gate reported)
        run: npm run episode:validate -- --episode ep-001

      - name: Upload environment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-report
          path: manifests/environment.json
          if-no-files-found: warn
